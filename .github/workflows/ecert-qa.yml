name: GS26 Native eCERT QA (offline)

on:
  push:
    branches:
      - staging/ecert-gs26-review
      - staging/ecert-phase2-google-qa
      - staging/ecert-phase3-reliability
    paths:
      - 'staging/native-ecert/**'
      - '.github/workflows/ecert-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eligibility:
    name: Offline eligibility and safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
      - name: Node runtime
        run: node --version
      - name: Syntax check
        run: |
          node --check staging/native-ecert/test-eligibility.js
          cp staging/native-ecert/Eligibility.gs /tmp/gs26-eligibility.js
          cp staging/native-ecert/Engine.gs /tmp/gs26-engine.js
          node --check /tmp/gs26-eligibility.js
          node --check /tmp/gs26-engine.js
          cp staging/native-ecert/Integration_QA.gs /tmp/gs26-integration-qa.js
          node --check /tmp/gs26-integration-qa.js
          node --check staging/native-ecert/test-phase2.js
          cp staging/native-ecert/Reliability.gs /tmp/gs26-reliability.js
          cp staging/native-ecert/Phase3_QA.gs /tmp/gs26-phase3-qa.js
          node --check /tmp/gs26-reliability.js
          node --check /tmp/gs26-phase3-qa.js
          node --check staging/native-ecert/test-reliability.js
      - name: Run offline QA
        run: |
          node staging/native-ecert/test-eligibility.js
          node staging/native-ecert/test-phase2.js
          node staging/native-ecert/test-reliability.js
