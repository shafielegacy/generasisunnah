name: GS26 simple check-in offline safety
on:
  push:
    branches:
      - fix/simple-date-gated-checkin-20261127
    paths:
      - 'gas/Code.gs'
      - 'js/checkin.js'
      - 'index.html'
      - 'tests/checkin-date-gate.test.js'
      - '.github/workflows/checkin-date-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  date-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check Apps Script and frontend
        run: |
          cp gas/Code.gs /tmp/gs26-backend.js
          node --check /tmp/gs26-backend.js
          node --check js/checkin.js
          node --check tests/checkin-date-gate.test.js
      - name: Offline mocked check-in tests
        run: node tests/checkin-date-gate.test.js
